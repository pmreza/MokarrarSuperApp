services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: mokarrar-backend
    runtime: docker
    dockerfilePath: ./core/backend/Dockerfile
    dockerContext: ./core
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/utils/health-check/
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: MOCK_EXTERNAL_SERVICES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mokarrar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_SUPERUSER
        value: admin@mokarrar.com
      - key: FIRST_SUPERUSER_PASSWORD
        generateValue: true

  # 2. Frontend Static Site (React 19 + Vite)
  - type: web
    name: mokarrar-frontend
    runtime: static
    buildCommand: cd core/frontend && npm install && npm run build
    staticPublishPath: core/frontend/dist
    plan: free
    region: frankfurt
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mokarrar-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: mokarrar-db
    plan: free
    region: frankfurt
    databaseName: mokarrar
    user: mokarrar_user
